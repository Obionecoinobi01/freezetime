# technocore-chat, self-hosted, behind Caddy for automatic TLS.
#
#   git clone https://github.com/flop-labs/technocore-chat ./technocore-chat
#   cp technocore.env.example technocore.env      # then edit it
#   docker compose up -d
#
# Only Caddy is exposed. technocore listens on the private compose network, which
# is what makes trusting X-Forwarded-For safe — nothing but Caddy can set it.

services:
  technocore:
    build:
      context: ./technocore-chat
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: technocore.env
    volumes:
      - chat-data:/data
    expose:
      - "8080"
    # No `ports:` on purpose. Publishing 8080 would let anyone reach the app
    # directly and forge the header Caddy sets, which would hand every caller
    # a rate-limit budget of their choosing.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - technocore
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # certificates live here — losing this re-issues them
      - caddy-config:/config

volumes:
  chat-data:
  caddy-data:
  caddy-config:
