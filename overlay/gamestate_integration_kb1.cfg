// CS2 Game State Integration -> kb1 feed
// Drop this in:  …/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/cfg/
// Then run:      python3 feed.py listen --profile cs2 --port 31337
//
// CS2 is the HTTP client here: it POSTs JSON to the uri below whenever the game
// state changes, with a heartbeat in between. Nothing is exposed — 127.0.0.1 only.
"kb1"
{
    "uri"       "http://127.0.0.1:31337/"
    "timeout"   "5.0"
    "buffer"    "0.1"
    "throttle"  "0.5"
    "heartbeat" "30.0"
    "data"
    {
        "provider"                 "1"   // which game, steamid, timestamp
        "map"                      "1"   // map name, phase, round number
        "round"                    "1"   // round phase, bomb state
        "player_id"                "1"   // steamid of the observed player
        "player_state"             "1"   // health, armour, money
        "player_match_stats"       "1"   // kills, deaths, assists, score  <- the one that matters
    }
}
